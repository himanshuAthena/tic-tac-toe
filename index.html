<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

  <div class="app">

    <!-- Header -->
    <header class="appHeader">
      <h2>🎮 Tic Tac Toe</h2>
      <p class="subtitle">Play & Enjoy</p>
    </header>

    <!-- Game Card -->
    <div class="gameCard">

      <!-- Game Board -->
      <div class="container">
        <div class="line"></div>

        <div class="box"><span class="boxtext"></span></div>
        <div class="box"><span class="boxtext"></span></div>
        <div class="box"><span class="boxtext"></span></div>

        <div class="box"><span class="boxtext"></span></div>
        <div class="box"><span class="boxtext"></span></div>
        <div class="box"><span class="boxtext"></span></div>

        <div class="box"><span class="boxtext"></span></div>
        <div class="box"><span class="boxtext"></span></div>
        <div class="box"><span class="boxtext"></span></div>
      </div>

      <!-- Info Section -->
      <div class="gameInfo">
        <span class="info">Turn for X</span>
        <button id="reset">Reset Game</button>
        <button id="musicToggle">🔊 Music On</button>
      </div>

      <!-- Celebration Image -->
      <div class="imgbox">
        <img src="excited.gif" alt="Celebration" />
      </div>

    </div>

  </div>

  <!-- WINNING DROPDOWN PANEL -->
  <div id="winDropdown" class="winDropdown">
    <div class="winBox">
      <h1 id="winnerName">🎉 X Wins!</h1>
      <p>That was an amazing move 👏</p>

      <!-- GIF INSIDE MODAL -->
      <div class="winGif">
        <img id="winGifImg" src="excited.gif" alt="Celebration" />
      </div>

      <button id="playAgainBtn">Play Again</button>
    </div>
  </div>

  <!-- Script -->
  <script src="script.js"></script>

</body>
</html>
